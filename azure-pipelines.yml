# ── Deploy Produção (branch: master) ─────────────────────────────────────────
- stage: deploy_prd
  displayName: "Deploy — Produção"
  dependsOn: build
  condition: and(succeeded('build'), eq(variables['Build.SourceBranchName'], 'master'))
