# ── Stage 4: Deploy para Produção (branch: master) ───────────────────────────
- stage: deploy_prd
  displayName: "Deploy — Produção"
  dependsOn: build
  condition: and(succeeded('build'), eq(variables['Build.SourceBranchName'], 'master'))
  jobs:
  - deployment: deploy
    displayName: "Helm upgrade — Production"
    environment: Production
    pool:
