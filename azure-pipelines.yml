              MAX_UNAVAILABLE: $(MAX_UNAVAILABLE)
              MAX_SURGE: $(MAX_SURGE)
              MIN_REPLICAS: $(MIN_REPLICAS)
              REQUESTS_CPU: $(REQUESTS_CPU)
