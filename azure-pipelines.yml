# ─────────────────────────────────────────────────────────────────────────────
# GUIA DE VARIABLE GROUPS
# Criar em: Pipelines > Library > + Variable group
#
# ── painelmonitoramento-common ───────────────────────────────────────────────
# DOCKER_BUILD_CONTEXT_FOLDER  = $(Build.SourcesDirectory)
# DOCKER_IMAGE_NAME            = painelmonitoramento
# DOCKER_REGISTRY_PROJECT      = mgi-sgp
# DOCKER_REGISTRY_URL          = registry.api.gov.br
# DOCKERFILE_PATH              = $(Build.SourcesDirectory)/Dockerfile
# IMAGE_PULL_SECRETS_NAME      = harbor-credentials
# KUBE_SERVER                  = https://console.api.gov.br/k8s/clusters/c-m-vp47bjms
# PROJECT_NAME                 = painelmonitoramento
# RANCHER_IMAGE_PULL_USERNAME  = <usuário Harbor com pull> [marcar como segredo]
# RANCHER_IMAGE_PULL_TOKEN     = <token Harbor com pull>  [marcar como segredo]
#
# ── painelmonitoramento-dev ──────────────────────────────────────────────────
# APPLICATION_PORT             = 3838
# CERT_MANAGER_CLUSTER_ISSUER  = lets-dth
# INGRESS_URL                  = painelmonitoramento-dev.dth.api.gov.br
# KUBE_NAMESPACE               = painelmonitoramento-dev
# KUBE_TOKEN                   = <token do SA azure-devops no namespace dev> [segredo]
# LIMITS_CPU                   = 1500m
# LIMITS_MEM                   = 2Gi
# MAX_REPLICAS                 = 2
# MAX_SURGE                    = 25%
# MAX_UNAVAILABLE              = 25%
# MIN_REPLICAS                 = 1
# REQUESTS_CPU                 = 500m
# REQUESTS_MEM                 = 1Gi
# SCALING_BY_CPU_PERC          = 70
#
# ── painelmonitoramento-hom  (mesmas chaves; KUBE_TOKEN = SA do namespace hom) ─
# ── painelmonitoramento-prod (mesmas chaves; KUBE_TOKEN = SA do namespace prod) ─
# ─────────────────────────────────────────────────────────────────────────────
