# Pipeline CI/CD — PainelMonitoramento (R Shiny / Golem)
#
# Segue o padrão de variable groups da esteira ColaboraGov-MGI-SGP.
# Extensões necessárias (já instaladas na org):
#   - Replace Tokens (Guillaume ROUCHON / qetza)
#
# Variable groups necessários (Pipelines > Library):
#   painelmonitoramento-common  — variáveis comuns a todos os ambientes
#   painelmonitoramento-dev     — variáveis do ambiente de Desenvolvimento
#   painelmonitoramento-hom     — variáveis do ambiente de Homologação
#   painelmonitoramento-prod    — variáveis do ambiente de Produção
# (ver comentário ao final deste arquivo com a lista completa de variáveis)

trigger:
  branches:
    include:
      - master
      - develop
      - release/*

variables:
  - group: painelmonitoramento-common
  - ${{ if or(eq(variables['Build.SourceBranchName'], 'master'), contains(variables['Build.SourceBranch'], 'refs/tags/')) }}:
    - group: painelmonitoramento-prod
  - ${{ elseif contains(variables['Build.SourceBranch'], 'refs/heads/release/') }}:
    - group: painelmonitoramento-hom
  - ${{ else }}:
    - group: painelmonitoramento-dev

stages:

# ── Build: cria imagem Docker e envia ao Harbor ───────────────────────────────
- stage: build
  displayName: "Build — imagem Docker para Harbor"
  condition: |
    or(
      eq(variables['Build.SourceBranchName'], 'master'),
      eq(variables['Build.SourceBranchName'], 'develop'),
      contains(variables['Build.SourceBranch'], 'refs/heads/release/')
    )
  jobs:
  - job: docker_build
    displayName: "Build e Push para Harbor"
    pool:
      vmImage: ubuntu-24.04
    steps:
    - task: Docker@2
      displayName: "Build e push da imagem Docker"
      inputs:
        command: buildAndPush
        containerRegistry: Harbor Registry
        repository: $(DOCKER_REGISTRY_PROJECT)/$(DOCKER_IMAGE_NAME)
        dockerfile: $(DOCKERFILE_PATH)
        buildContext: $(DOCKER_BUILD_CONTEXT_FOLDER)
        tags: |
          $(Build.BuildId)
          latest

# ── Deploy Desenvolvimento (branch: develop) ──────────────────────────────────
- stage: deploy_dev
  displayName: "Deploy — Desenvolvimento"
  dependsOn: build
  condition: and(succeeded('build'), eq(variables['Build.SourceBranchName'], 'develop'))
  jobs:
  - deployment: deploy
    displayName: "Helm upgrade — Development"
    environment: Development
    pool:
      vmImage: ubuntu-24.04
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: qetza.replacetokens.replacetokens-task.replacetokens@6
            displayName: "Substituir tokens em helm/values.yaml"
            inputs:
              sources: helm/values.yaml
              tokenPattern: custom
              tokenPrefix: '${'
              tokenSuffix: '}'
          - bash: |
              echo "$RANCHER_IMAGE_PULL_TOKEN" | helm registry login "$DOCKER_REGISTRY_URL" \
                --username "$RANCHER_IMAGE_PULL_USERNAME" \
                --password-stdin
            displayName: "Helm registry login (Harbor OCI)"
            env:
              HELM_EXPERIMENTAL_OCI: "1"
              DOCKER_REGISTRY_URL: $(DOCKER_REGISTRY_URL)
              RANCHER_IMAGE_PULL_USERNAME: $(RANCHER_IMAGE_PULL_USERNAME)
              RANCHER_IMAGE_PULL_TOKEN: $(RANCHER_IMAGE_PULL_TOKEN)
          - task: HelmDeploy@0
            displayName: "Helm upgrade — Development"
            inputs:
              connectionType: Kubernetes Service Connection
              kubernetesServiceEndpoint: $(CLUSTER_SERVICE_CONNECTION)
              namespace: $(KUBE_NAMESPACE)
              command: upgrade
              chartType: Name
              chartName: oci://registry.api.gov.br/helm-charts/rancher-kubernetes-helm-chart
              chartVersion: 1.0.1+69
              releaseName: $(PROJECT_NAME)
              valueFile: helm/values.yaml
              install: true
              arguments: --wait --timeout 10m

# ── Deploy Homologação (branch: release/*) ────────────────────────────────────
- stage: deploy_hom
  displayName: "Deploy — Homologação"
  dependsOn: build
  condition: and(succeeded('build'), contains(variables['Build.SourceBranch'], 'refs/heads/release/'))
  jobs:
