version: "3.9"

services:
  painel:
    build:
      context: .
      dockerfile: Dockerfile
    image: painelmonitoramento:local
    container_name: painel-monitoramento
    ports:
      - "3838:3838"
    environment:
      - PORT=3838
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3838"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
